name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  sokudo:
    name: install / typecheck / test / build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (bun workspaces)
        run: bun install --frozen-lockfile

      - name: Build framework (packages/sokudo)
        run: bun run build:sokudo

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build docs site (apps/docs) and examples
        run: |
          bun run build:docs
          bun run build:examples
