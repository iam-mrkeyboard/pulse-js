name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pulse-framework:
    name: pulse-framework (install / test / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulse-framework
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Test
        run: bun test

      - name: Build
        run: bun run build
